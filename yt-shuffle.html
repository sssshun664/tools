<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>YT Shuffle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --accent: #ff3d3d;
    --accent2: #ff8c42;
    --text: #f0f0f0;
    --muted: #666;
    --border: #2a2a2a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    padding: 20px 20px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.05em;
    color: var(--accent);
  }

  .logo span { color: var(--text); }

  /* Setup screen */
  #setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 20px;
    gap: 20px;
  }

  .setup-title {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1.3;
  }

  .setup-title em {
    font-style: normal;
    color: var(--accent);
  }

  label {
    display: block;
    font-size: 0.7rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.85rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }

  .hint {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  .btn-primary {
    width: 100%;
    padding: 16px;
    background: var(--accent);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn-primary:active { transform: scale(0.97); opacity: 0.9; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .error-msg {
    background: #2a0a0a;
    border: 1px solid #5a1a1a;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.8rem;
    color: #ff8888;
    display: none;
  }

  /* Player screen */
  #player {
    display: none;
    flex-direction: column;
    flex: 1;
  }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: var(--border);
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.3s;
  }

  /* Now playing info */
  .now-playing {
    padding: 16px 20px 12px;
  }

  .np-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .np-title {
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .np-channel {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .np-count {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Thumbnail */
  .thumb-wrap {
    position: relative;
    margin: 0 20px;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 16/9;
    background: var(--surface);
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .thumb-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
  }

  .duration-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* Controls */
  .controls {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn-open {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    color: #fff;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.03em;
  }

  .btn-open:active { transform: scale(0.97); opacity: 0.9; }

  .play-icon {
    width: 22px;
    height: 22px;
    background: rgba(255,255,255,0.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .play-icon svg { margin-left: 2px; }

  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-secondary {
    flex: 1;
    padding: 14px;
    background: var(--surface);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-secondary:active { transform: scale(0.97); background: var(--surface2); }

  /* Queue */
  .queue-section {
    padding: 0 20px 16px;
    flex: 1;
  }

  .queue-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .queue-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
  }

  .queue-item {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
    transition: background 0.15s;
    border: 1px solid transparent;
  }

  .queue-item:active { background: var(--surface2); }

  .queue-item.active {
    border-color: var(--accent);
    background: rgba(255,61,61,0.08);
  }

  .queue-thumb {
    width: 52px;
    height: 30px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface2);
  }

  .queue-title {
    font-size: 0.75rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .queue-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    flex-shrink: 0;
    width: 18px;
    text-align: center;
  }

  .queue-item.active .queue-num { color: var(--accent); }

  /* Loading */
  .loading {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 16px;
    padding: 40px 20px;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-family: 'Space Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  /* Reset link */
  .reset-link {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
    padding: 12px;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
    transition: color 0.2s;
  }

  .reset-link:active { color: var(--text); }

  /* Playlist URL tip */
  .playlist-tip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.6;
    margin-top: 2px;
  }

  .playlist-tip strong { color: var(--text); }

  /* Reshuffle animation */
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }

  .pop { animation: popIn 0.25s ease; }
</style>
</head>
<body>

<header>
  <div class="logo">YT<span>Shuffle</span></div>
</header>

<!-- Setup -->
<div id="setup">
  <div class="setup-title">チャンネルの動画を<br><em>ランダム再生</em>する</div>

  <div class="field">
    <label>YouTube Data API キー</label>
    <input type="text" id="apiKey" placeholder="AIza..." autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="hint">Google Cloud Console で取得できます。このページ内にのみ保存されます。</div>
  </div>

  <div class="field">
    <label>チャンネル URL または ID</label>
    <input type="text" id="channelInput" placeholder="https://www.youtube.com/@channelname" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="hint">@handle / channel/UC... / watch?v= の形式に対応</div>
  </div>

  <div class="row">
    <div class="field">
      <label>取得動画数</label>
      <input type="number" id="maxVideos" value="30" min="5" max="200">
    </div>
    <div class="field">
      <label>キュー本数</label>
      <input type="number" id="queueSize" value="10" min="3" max="50">
    </div>
  </div>

  <div id="errorMsg" class="error-msg"></div>

  <button class="btn-primary" id="startBtn" onclick="startShuffle()">シャッフル開始</button>

  <div class="playlist-tip">
    💡 <strong>使い方:</strong>「YouTubeで開く」を押すと公式アプリが起動します。バックグラウンド再生・スリープ中の再生はプレミアムが自動で適用されます。
  </div>
</div>

<!-- Loading -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <p>動画を取得中...<br>少しお待ちください</p>
</div>

<!-- Player -->
<div id="player">
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:10%"></div>
  </div>

  <div class="now-playing">
    <div class="np-label">▶ NOW PLAYING</div>
    <div class="np-title" id="npTitle">—</div>
    <div class="np-channel" id="npChannel">—</div>
    <div class="np-count" id="npCount"></div>
  </div>

  <div class="thumb-wrap">
    <img id="npThumb" src="" alt="">
    <div class="thumb-overlay"></div>
    <div class="duration-badge" id="npDuration"></div>
  </div>

  <div class="controls">
    <button class="btn-open" id="openBtn" onclick="openCurrent()">
      <div class="play-icon">
        <svg width="10" height="12" viewBox="0 0 10 12" fill="white">
          <path d="M0 0L10 6L0 12V0Z"/>
        </svg>
      </div>
      YouTubeで開く（プレイリスト）
    </button>

    <div class="btn-row">
      <button class="btn-secondary" onclick="prevVideo()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        前の動画
      </button>
      <button class="btn-secondary" onclick="nextVideo()">
        次の動画
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 6-4.25v8.5L8.5 12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" onclick="reshuffleQueue()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 8.46 20 10.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        キューを再シャッフル
      </button>
      <button class="btn-secondary" onclick="resetApp()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        最初に戻る
      </button>
    </div>
  </div>

  <div class="queue-section">
    <div class="queue-label">キュー</div>
    <div class="queue-list" id="queueList"></div>
  </div>
</div>

<script>
let allVideos = [];
let queue = [];
let currentIndex = 0;
let channelTitle = '';

// --- Persist API key ---
const savedKey = localStorage.getItem('yt_api_key');
if (savedKey) document.getElementById('apiKey').value = savedKey;

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

// Extract channel ID from various URL formats
async function resolveChannelId(input, apiKey) {
  input = input.trim();

  // Direct channel ID
  if (input.startsWith('UC') && input.length === 24) return input;

  // URL patterns
  const patterns = [
    /youtube\.com\/channel\/(UC[\w-]{22})/,
    /youtube\.com\/@([\w.-]+)/,
    /youtube\.com\/user\/([\w-]+)/,
    /youtube\.com\/c\/([\w-]+)/,
  ];

  for (const pat of patterns) {
    const m = input.match(pat);
    if (m) {
      const val = m[1];
      if (val.startsWith('UC')) return val;

      // handle / username: need to resolve via API
      const type = input.includes('/@') ? 'forHandle' : 'forUsername';
      const param = type === 'forHandle' ? `forHandle=${encodeURIComponent('@' + val)}` : `forUsername=${encodeURIComponent(val)}`;
      const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id&${param}&key=${apiKey}`);
      const data = await res.json();
      if (data.items && data.items.length) return data.items[0].id;
      throw new Error('チャンネルが見つかりません');
    }
  }

  // Bare handle like @name
  if (input.startsWith('@')) {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=${encodeURIComponent(input)}&key=${apiKey}`);
    const data = await res.json();
    if (data.items && data.items.length) return data.items[0].id;
    throw new Error('チャンネルが見つかりません');
  }

  throw new Error('URLまたはチャンネルIDの形式が正しくありません');
}

async function fetchAllVideos(channelId, apiKey, maxVideos) {
  // Get uploads playlist ID
  const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails,snippet&id=${channelId}&key=${apiKey}`);
  const chData = await chRes.json();
  if (!chData.items || !chData.items.length) throw new Error('チャンネルの情報を取得できませんでした');

  channelTitle = chData.items[0].snippet.title;
  const uploadsId = chData.items[0].contentDetails.relatedPlaylists.uploads;

  let videos = [];
  let pageToken = '';
  const perPage = Math.min(maxVideos, 50);

  while (videos.length < maxVideos) {
    const url = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=${uploadsId}&maxResults=${perPage}&key=${apiKey}${pageToken ? '&pageToken=' + pageToken : ''}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    for (const item of (data.items || [])) {
      const s = item.snippet;
      if (s.resourceId && s.resourceId.videoId) {
        videos.push({
          id: s.resourceId.videoId,
          title: s.title,
          thumb: s.thumbnails?.medium?.url || s.thumbnails?.default?.url || '',
          channel: s.channelTitle,
        });
      }
    }

    if (!data.nextPageToken) break;
    pageToken = data.nextPageToken;
    if (videos.length >= maxVideos) break;
  }

  return videos.slice(0, maxVideos);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function startShuffle() {
  hideError();
  const apiKey = document.getElementById('apiKey').value.trim();
  const channelInput = document.getElementById('channelInput').value.trim();
  const maxVideos = parseInt(document.getElementById('maxVideos').value) || 30;
  const queueSize = parseInt(document.getElementById('queueSize').value) || 10;

  if (!apiKey) { showError('APIキーを入力してください'); return; }
  if (!channelInput) { showError('チャンネルURLを入力してください'); return; }

  localStorage.setItem('yt_api_key', apiKey);

  document.getElementById('setup').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('startBtn').disabled = true;

  try {
    const channelId = await resolveChannelId(channelInput, apiKey);
    allVideos = await fetchAllVideos(channelId, apiKey, maxVideos);

    if (!allVideos.length) throw new Error('動画が見つかりませんでした');

    const shuffled = shuffle(allVideos);
    queue = shuffled.slice(0, Math.min(queueSize, shuffled.length));
    currentIndex = 0;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('player').style.display = 'flex';
    renderPlayer();
    renderQueue();
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('startBtn').disabled = false;
    showError('エラー: ' + (e.message || '不明なエラー'));
  }
}

function renderPlayer() {
  if (!queue.length) return;
  const v = queue[currentIndex];
  document.getElementById('npTitle').textContent = v.title;
  document.getElementById('npChannel').textContent = channelTitle;
  document.getElementById('npCount').textContent = `${currentIndex + 1} / ${queue.length}`;
  document.getElementById('npThumb').src = v.thumb;
  document.getElementById('npThumb').classList.add('pop');
  setTimeout(() => document.getElementById('npThumb').classList.remove('pop'), 300);

  const pct = ((currentIndex + 1) / queue.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQueue() {
  const list = document.getElementById('queueList');
  list.innerHTML = '';
  queue.forEach((v, i) => {
    const item = document.createElement('div');
    item.className = 'queue-item' + (i === currentIndex ? ' active' : '');
    const num = document.createElement('div');
    num.className = 'queue-num';
    num.textContent = i === currentIndex ? '▶' : (i + 1);
    const img = document.createElement('img');
    img.className = 'queue-thumb';
    img.src = v.thumb;
    img.alt = '';
    img.loading = 'lazy';
    const title = document.createElement('div');
    title.className = 'queue-title';
    title.textContent = v.title;
    item.appendChild(num);
    item.appendChild(img);
    item.appendChild(title);
    item.onclick = () => { currentIndex = i; renderPlayer(); renderQueue(); };
    list.appendChild(item);
  });

  // Scroll active into view
  const active = list.querySelector('.active');
  if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function buildPlaylistUrl() {
  // Build a YouTube playlist URL with current and remaining videos
  // YouTube accepts: youtube.com/watch_videos?video_ids=id1,id2,...
  const ids = [];
  for (let i = currentIndex; i < queue.length; i++) ids.push(queue[i].id);
  // Wrap around
  for (let i = 0; i < currentIndex; i++) ids.push(queue[i].id);

  const idList = ids.join(',');
  return `https://www.youtube.com/watch_videos?video_ids=${idList}`;
}

function openCurrent() {
  const url = buildPlaylistUrl();
  window.location.href = url;
}

function nextVideo() {
  if (currentIndex < queue.length - 1) {
    currentIndex++;
  } else {
    // Reshuffle and loop
    const shuffled = shuffle(allVideos);
    const queueSize = parseInt(document.getElementById('queueSize').value) || 10;
    queue = shuffled.slice(0, Math.min(queueSize, shuffled.length));
    currentIndex = 0;
  }
  renderPlayer();
  renderQueue();
}

function prevVideo() {
  if (currentIndex > 0) currentIndex--;
  renderPlayer();
  renderQueue();
}

function reshuffleQueue() {
  const shuffled = shuffle(allVideos);
  const queueSize = queue.length;
  queue = shuffled.slice(0, Math.min(queueSize, shuffled.length));
  currentIndex = 0;
  renderPlayer();
  renderQueue();
}

function resetApp() {
  document.getElementById('player').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('startBtn').disabled = false;
  allVideos = [];
  queue = [];
  currentIndex = 0;
}
</script>

</body>
</html>
