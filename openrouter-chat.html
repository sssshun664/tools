<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenRouter Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }

    .markdown-content { line-height: 1.65; }
    .markdown-content h1 { font-size: 1.4em; font-weight: 700; margin: 0.8em 0 0.4em; }
    .markdown-content h2 { font-size: 1.2em; font-weight: 700; margin: 0.8em 0 0.4em; }
    .markdown-content h3 { font-size: 1.05em; font-weight: 600; margin: 0.6em 0 0.3em; }
    .markdown-content p { margin: 0.5em 0; }
    .markdown-content p:first-child { margin-top: 0; }
    .markdown-content p:last-child { margin-bottom: 0; }
    .markdown-content ul { padding-left: 1.4em; margin: 0.4em 0; list-style-type: disc; }
    .markdown-content ol { padding-left: 1.4em; margin: 0.4em 0; list-style-type: decimal; }
    .markdown-content li { margin: 0.2em 0; }
    .markdown-content code:not(pre code) {
      background: #1e293b; color: #e2e8f0;
      padding: 0.15em 0.4em; border-radius: 4px; font-size: 0.88em;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
    }
    .markdown-content pre {
      margin: 0.75em 0; border-radius: 8px; overflow: hidden;
      border: 1px solid #374151;
    }
    .markdown-content pre code { font-size: 0.84em; padding: 1em !important; display: block; overflow-x: auto; }
    .markdown-content blockquote {
      border-left: 3px solid #4b5563; padding-left: 1em; margin: 0.5em 0;
      color: #9ca3af; font-style: italic;
    }
    .markdown-content table { border-collapse: collapse; width: 100%; margin: 0.75em 0; font-size: 0.9em; }
    .markdown-content th, .markdown-content td { border: 1px solid #374151; padding: 0.4em 0.8em; text-align: left; }
    .markdown-content th { background: #1f2937; font-weight: 600; }
    .markdown-content tr:nth-child(even) { background: #111827; }
    .markdown-content a { color: #60a5fa; text-decoration: underline; }
    .markdown-content a:hover { color: #93c5fd; }
    .markdown-content hr { border: none; border-top: 1px solid #374151; margin: 1em 0; }

    .typing-dot {
      display: inline-block; width: 6px; height: 6px;
      background: #6b7280; border-radius: 50%;
      animation: typing-bounce 1.4s infinite ease-in-out;
      margin: 0 1.5px;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .chat-item { cursor: pointer; transition: background 0.15s; }
    .chat-item.active { background: #1f2937; color: #f9fafb; }
    .chat-item:not(.active):hover { background: #111827; }
    textarea { font-family: inherit; }

    /* Sidebar toggle */
    #sidebar { transition: width 0.2s ease, opacity 0.2s ease; }
    #sidebar.collapsed { width: 0; opacity: 0; overflow: hidden; border-right: none; padding: 0; }

    /* Scroll-down button */
    #scrollDownBtn {
      position: absolute; bottom: 16px; right: 16px;
      width: 36px; height: 36px; border-radius: 50%;
      background: #1f2937; border: 1px solid #374151;
      color: #9ca3af; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      transition: opacity 0.2s, background 0.15s;
      z-index: 10;
    }
    #scrollDownBtn:hover { background: #374151; color: #e5e7eb; }

    /* Enter hint */
    #enterHint {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      background: #1f2937; border: 1px solid #374151; border-radius: 8px;
      padding: 4px 12px; font-size: 12px; color: #9ca3af;
      white-space: nowrap; pointer-events: none;
      animation: fadeInUp 0.15s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(4px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Copy button */
    .copy-btn {
      opacity: 0; transition: opacity 0.15s;
      cursor: pointer; padding: 4px; border-radius: 6px;
      color: #6b7280; background: transparent; border: none;
    }
    .copy-btn:hover { color: #d1d5db; background: #374151; }
    .msg-wrap:hover .copy-btn { opacity: 1; }

    /* Mobile */
    @media (max-width: 768px) {
      #sidebar { position: fixed; z-index: 40; height: 100%; }
      #sidebar.collapsed { width: 0; }
      #sidebar:not(.collapsed) { width: 260px; }
      #sidebarOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 39; }
      #sidebarOverlay.active { display: block; }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex overflow-hidden font-sans">

  <!-- Sidebar Overlay (mobile) -->
  <div id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="w-60 flex-shrink-0 bg-gray-900 flex flex-col border-r border-gray-800">
    <div class="p-3">
      <button id="newChatBtn"
        class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 active:bg-gray-600 transition-colors text-sm font-medium text-gray-200">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        新しいチャット
      </button>
    </div>

    <div id="chatList" class="flex-1 overflow-y-auto px-2 space-y-0.5 py-1"></div>

    <div class="p-3 border-t border-gray-800">
      <button id="settingsBtn"
        class="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-800 transition-colors text-sm text-gray-400 hover:text-gray-200">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        設定
      </button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="flex items-center justify-between px-5 py-3 border-b border-gray-800 bg-gray-900 flex-shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <button id="sidebarToggle" class="p-1.5 rounded-lg hover:bg-gray-800 transition-colors text-gray-400 hover:text-gray-200 flex-shrink-0" title="サイドバー切替">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <h1 class="font-semibold text-gray-100 text-sm whitespace-nowrap">OpenRouter Chat</h1>
        <span id="modelBadge"
          class="text-xs text-gray-400 bg-gray-800 px-2.5 py-1 rounded-full truncate max-w-xs border border-gray-700"></span>
      </div>
      <div id="streamStatus" class="text-xs text-gray-500 flex-shrink-0"></div>
    </header>

    <div class="flex-1 relative overflow-hidden">
      <div id="messagesArea" class="h-full overflow-y-auto px-4 py-5 space-y-5"></div>
      <button id="scrollDownBtn" aria-label="一番下へスクロール">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
        </svg>
      </button>
    </div>

    <div class="px-4 pb-4 pt-3 border-t border-gray-800 bg-gray-900 flex-shrink-0">
      <div class="max-w-3xl mx-auto flex gap-2 items-end relative">
        <div id="enterHint" style="display:none;">もう一度 Enter で送信</div>
        <div class="flex-1">
          <textarea id="messageInput"
            placeholder="メッセージを入力… (Enter×2 で送信)"
            class="w-full bg-gray-800 rounded-xl px-4 py-3 text-sm resize-none outline-none border border-gray-700 focus:border-blue-500/50 transition-colors min-h-[52px] max-h-48 leading-relaxed"
            rows="1"></textarea>
        </div>
        <button id="sendBtn"
          class="flex-shrink-0 p-3 rounded-xl bg-blue-600 hover:bg-blue-500 active:bg-blue-700 disabled:bg-gray-800 disabled:text-gray-600 disabled:cursor-not-allowed transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal"
    class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 items-center justify-center p-4"
    style="display:none;">
    <div class="bg-gray-900 rounded-2xl w-full max-w-lg border border-gray-700/80 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
        <h2 class="text-base font-semibold">設定</h2>
        <button id="closeSettingsBtn" class="text-gray-500 hover:text-gray-200 transition-colors p-1 rounded-lg hover:bg-gray-800">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div class="overflow-y-auto flex-1">
        <div class="px-6 py-5 space-y-5">
          <!-- API Key -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">
              OpenRouter API キー
              <a href="https://openrouter.ai/keys" target="_blank" rel="noopener"
                class="ml-2 text-xs text-blue-400 hover:text-blue-300 hover:underline">取得 →</a>
            </label>
            <div class="relative">
              <input id="apiKeyInput" type="password" placeholder="sk-or-v1-..."
                class="w-full bg-gray-800 rounded-lg px-4 py-2.5 text-sm outline-none border border-gray-700 focus:border-blue-500/50 transition-colors pr-16"/>
              <button id="toggleApiKey"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-500 hover:text-gray-300 font-medium transition-colors">
                表示
              </button>
            </div>
          </div>

          <!-- Model -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">モデル</label>
            <select id="modelSelect"
              class="w-full bg-gray-800 rounded-lg px-4 py-2.5 text-sm outline-none border border-gray-700 focus:border-blue-500/50 transition-colors">
              <option value="google/gemini-3.1-pro-preview">google/gemini-3.1-pro-preview</option>
            </select>
            <p id="modelCountMsg" class="text-xs text-gray-500 mt-1.5"></p>
          </div>

          <!-- System Instruction -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="text-sm font-medium text-gray-300">システムインストラクション</label>
              <button id="resetSystemBtn" class="text-xs text-gray-500 hover:text-gray-300 transition-colors">
                デフォルトに戻す
              </button>
            </div>
            <textarea id="systemInput"
              class="w-full bg-gray-800 rounded-lg px-4 py-3 text-sm outline-none border border-gray-700 focus:border-blue-500/50 transition-colors resize-none h-32 leading-relaxed"
              placeholder="You are a helpful assistant."></textarea>
          </div>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-gray-800">
        <button id="saveSettingsBtn"
          class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-xl py-2.5 text-sm font-semibold transition-colors">
          保存して閉じる
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_MODEL = 'google/gemini-3.1-pro-preview';
    const DEFAULT_SYSTEM = 'You are a helpful assistant.';
    const API_BASE = 'https://openrouter.ai/api/v1';
    const STORAGE_KEY = 'openrouter-chat-v2';

    let state = {
      apiKey: '',
      selectedModel: DEFAULT_MODEL,
      systemInstruction: DEFAULT_SYSTEM,
      chats: [],
      currentChatId: null,
    };

    let isStreaming = false;

    // ── Persistence ──
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) Object.assign(state, JSON.parse(raw));
      } catch (_) {}
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function genId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    // ── Chat Management ──
    function getCurrentChat() {
      return state.chats.find(c => c.id === state.currentChatId) || null;
    }

    function createNewChat() {
      const chat = { id: genId(), title: '新しいチャット', messages: [], createdAt: Date.now() };
      state.chats.unshift(chat);
      state.currentChatId = chat.id;
      saveState();
      renderSidebar();
      renderMessages();
      document.getElementById('messageInput').focus();
    }

    function switchChat(id) {
      state.currentChatId = id;
      saveState();
      renderSidebar();
      renderMessages();
    }

    function deleteChat(id) {
      state.chats = state.chats.filter(c => c.id !== id);
      if (state.currentChatId === id) {
        state.currentChatId = state.chats.length ? state.chats[0].id : null;
        if (!state.currentChatId) { createNewChat(); return; }
        renderMessages();
      }
      saveState();
      renderSidebar();
    }

    function autoTitle(chat) {
      if (chat.messages.length === 1 && chat.messages[0].role === 'user') {
        const t = chat.messages[0].content.trim();
        chat.title = t.slice(0, 32) + (t.length > 32 ? '…' : '');
      }
    }

    // ── Sidebar ──
    function renderSidebar() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      state.chats.forEach(chat => {
        const el = document.createElement('div');
        el.className = 'chat-item flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-sm group ' +
          (chat.id === state.currentChatId ? 'active text-gray-100' : 'text-gray-400');

        el.innerHTML = `
          <svg class="w-3.5 h-3.5 flex-shrink-0 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
          </svg>
          <span class="flex-1 truncate text-xs">${escapeHtml(chat.title)}</span>
          <button class="del-btn flex-shrink-0 opacity-0 group-hover:opacity-100 text-gray-600 hover:text-red-400 transition-all p-0.5 rounded" title="削除">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>`;

        el.querySelector('.del-btn').addEventListener('click', e => { e.stopPropagation(); deleteChat(chat.id); });
        el.addEventListener('click', () => switchChat(chat.id));
        list.appendChild(el);
      });
    }

    // ── Messages ──
    function renderMessages() {
      const area = document.getElementById('messagesArea');
      const chat = getCurrentChat();
      area.innerHTML = '';

      if (!chat || chat.messages.length === 0) {
        area.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full text-center select-none">
            <div class="w-14 h-14 rounded-2xl bg-gray-800 flex items-center justify-center mb-4 border border-gray-700">
              <svg class="w-7 h-7 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
              </svg>
            </div>
            <p class="text-gray-400 font-medium">OpenRouter Chat</p>
            <p class="text-gray-600 text-sm mt-1.5">メッセージを入力して会話を始めましょう</p>
            <p class="text-gray-700 text-xs mt-3">モデル: <span class="text-gray-600">${escapeHtml(state.selectedModel)}</span></p>
          </div>`;
        return;
      }

      chat.messages.forEach(msg => area.appendChild(buildMsgEl(msg)));
      scrollBottom();
    }

    function buildMsgEl(msg) {
      const wrap = document.createElement('div');
      wrap.className = 'msg-wrap flex ' + (msg.role === 'user' ? 'justify-end' : 'justify-start');

      const container = document.createElement('div');
      container.className = 'flex flex-col ' + (msg.role === 'user' ? 'items-end' : 'items-start');

      const bubble = document.createElement('div');

      if (msg.role === 'user') {
        bubble.className = 'max-w-[78%] bg-blue-600 rounded-2xl rounded-tr-sm px-4 py-3 text-sm whitespace-pre-wrap leading-relaxed break-words';
        bubble.textContent = msg.content;
      } else {
        bubble.className = 'max-w-[85%] bg-gray-800 border border-gray-700/50 rounded-2xl rounded-tl-sm px-4 py-3 text-sm';

        const md = document.createElement('div');
        md.className = 'markdown-content';
        renderMd(md, msg.content || '');
        bubble.appendChild(md);

        if (msg.usage) {
          const u = msg.usage;
          const uEl = document.createElement('div');
          uEl.className = 'text-xs text-gray-500 mt-2.5 pt-2.5 border-t border-gray-700 flex gap-3';
          uEl.innerHTML = `
            <span>入力: <span class="text-gray-400">${u.prompt_tokens}</span></span>
            <span>出力: <span class="text-gray-400">${u.completion_tokens}</span></span>
            <span>合計: <span class="text-gray-400">${u.total_tokens}</span></span>`;
          bubble.appendChild(uEl);
        }
      }

      container.appendChild(bubble);

      // Copy button
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn mt-1';
      copyBtn.title = 'コピー';
      copyBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
      </svg>`;
      copyBtn.addEventListener('click', () => {
        const text = msg.role === 'user' ? msg.content : (msg.content || '');
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.innerHTML = `<svg class="w-3.5 h-3.5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>`;
          setTimeout(() => {
            copyBtn.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>`;
          }, 1500);
        });
      });
      container.appendChild(copyBtn);

      wrap.appendChild(container);
      return wrap;
    }

    function renderMd(el, text) {
      el.innerHTML = marked.parse(text, { breaks: true, gfm: true });
      el.querySelectorAll('pre code').forEach(b => {
        delete b.dataset.highlighted;
        hljs.highlightElement(b);
      });
    }

    function scrollBottom() {
      const area = document.getElementById('messagesArea');
      area.scrollTop = area.scrollHeight;
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Send ──
    async function sendMessage() {
      if (isStreaming) return;
      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;

      if (!state.apiKey) { openSettings(); return; }
      if (!state.currentChatId) createNewChat();

      const chat = getCurrentChat();
      if (!chat) return;

      chat.messages.push({ role: 'user', content });
      autoTitle(chat);
      input.value = '';
      input.style.height = 'auto';
      saveState();
      renderSidebar();

      // Render + typing indicator
      const area = document.getElementById('messagesArea');
      area.innerHTML = '';
      chat.messages.forEach(m => area.appendChild(buildMsgEl(m)));

      const typing = document.createElement('div');
      typing.className = 'flex justify-start';
      typing.innerHTML = `
        <div class="bg-gray-800 border border-gray-700/50 rounded-2xl rounded-tl-sm px-4 py-3.5">
          <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
        </div>`;
      area.appendChild(typing);
      scrollBottom();

      isStreaming = true;
      setSendState(true);
      document.getElementById('streamStatus').textContent = '生成中…';

      const apiMessages = [];
      if (state.systemInstruction.trim())
        apiMessages.push({ role: 'system', content: state.systemInstruction });
      chat.messages.forEach(m => apiMessages.push({ role: m.role, content: m.content }));

      try {
        const res = await fetch(`${API_BASE}/chat/completions`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${state.apiKey}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            model: state.selectedModel,
            messages: apiMessages,
            stream: true,
            stream_options: { include_usage: true },
            provider: { zdr: true },
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData?.error?.message || `HTTP ${res.status}: ${res.statusText}`);
        }

        typing.remove();

        const assistantMsg = { role: 'assistant', content: '' };
        chat.messages.push(assistantMsg);
        const msgEl = buildMsgEl(assistantMsg);
        area.appendChild(msgEl);
        const mdEl = msgEl.querySelector('.markdown-content');
        scrollBottom();

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();
            if (raw === '[DONE]') continue;

            try {
              const chunk = JSON.parse(raw);
              const delta = chunk.choices?.[0]?.delta?.content;
              if (delta) {
                assistantMsg.content += delta;
                mdEl.innerHTML = marked.parse(assistantMsg.content, { breaks: true, gfm: true });
                scrollBottom();
              }
              if (chunk.usage) assistantMsg.usage = chunk.usage;
            } catch (_) {}
          }
        }

        // Final syntax highlight
        mdEl.querySelectorAll('pre code').forEach(b => { delete b.dataset.highlighted; hljs.highlightElement(b); });

        // Render token usage
        if (assistantMsg.usage) {
          const u = assistantMsg.usage;
          const uEl = document.createElement('div');
          uEl.className = 'text-xs text-gray-500 mt-2.5 pt-2.5 border-t border-gray-700 flex gap-3';
          uEl.innerHTML = `
            <span>入力: <span class="text-gray-400">${u.prompt_tokens}</span></span>
            <span>出力: <span class="text-gray-400">${u.completion_tokens}</span></span>
            <span>合計: <span class="text-gray-400">${u.total_tokens}</span></span>`;
          msgEl.querySelector('.markdown-content').parentElement.appendChild(uEl);
        }

      } catch (err) {
        typing.remove();
        chat.messages = chat.messages.filter(m => !(m.role === 'assistant' && m.content === ''));
        const errEl = document.createElement('div');
        errEl.className = 'flex justify-start';
        errEl.innerHTML = `
          <div class="max-w-[85%] bg-red-950/50 border border-red-800/60 rounded-2xl px-4 py-3 text-sm text-red-400">
            <span class="font-medium">エラー:</span> ${escapeHtml(err.message)}
          </div>`;
        area.appendChild(errEl);
      } finally {
        isStreaming = false;
        setSendState(false);
        document.getElementById('streamStatus').textContent = '';
        saveState();
        scrollBottom();
        document.getElementById('messageInput').focus();
      }
    }

    function setSendState(on) {
      document.getElementById('sendBtn').disabled = on;
      document.getElementById('messageInput').disabled = on;
    }

    // ── Models ──
    async function loadModels() {
      const sel = document.getElementById('modelSelect');
      const msg = document.getElementById('modelCountMsg');
      msg.textContent = 'モデルを読み込み中…';
      sel.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/models`, {
          headers: state.apiKey ? { 'Authorization': `Bearer ${state.apiKey}` } : {},
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const models = (data.data || []).sort((a, b) => a.id.localeCompare(b.id));

        const groups = {};
        models.forEach(m => {
          const p = m.id.split('/')[0] || 'other';
          (groups[p] = groups[p] || []).push(m);
        });

        sel.innerHTML = '';
        Object.keys(groups).sort().forEach(provider => {
          const og = document.createElement('optgroup');
          og.label = provider;
          groups[provider].forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.id;
            const ctx = m.context_length ? ` (${Math.round(m.context_length / 1000)}k)` : '';
            opt.textContent = m.id.split('/').slice(1).join('/') + ctx;
            if (m.id === state.selectedModel) opt.selected = true;
            og.appendChild(opt);
          });
          sel.appendChild(og);
        });

        if (!models.find(m => m.id === state.selectedModel)) {
          const opt = document.createElement('option');
          opt.value = state.selectedModel;
          opt.textContent = state.selectedModel;
          opt.selected = true;
          sel.insertBefore(opt, sel.firstChild);
        }

        msg.textContent = `${models.length} モデル利用可能`;
      } catch (e) {
        sel.innerHTML = `<option value="${escapeHtml(state.selectedModel)}">${escapeHtml(state.selectedModel)}</option>`;
        msg.textContent = `読み込み失敗: ${e.message}`;
      } finally {
        sel.disabled = false;
      }
    }

    // ── Settings ──
    function openSettings() {
      document.getElementById('apiKeyInput').value = state.apiKey;
      document.getElementById('systemInput').value = state.systemInstruction;
      document.getElementById('settingsModal').style.display = 'flex';
      loadModels();
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      state.apiKey = document.getElementById('apiKeyInput').value.trim();
      state.selectedModel = document.getElementById('modelSelect').value;
      state.systemInstruction = document.getElementById('systemInput').value.trim() || DEFAULT_SYSTEM;
      saveState();
      updateBadge();
      closeSettings();
    }

    function updateBadge() {
      const b = document.getElementById('modelBadge');
      b.textContent = state.selectedModel;
      b.title = state.selectedModel;
    }

    // ── Events ──
    document.getElementById('newChatBtn').addEventListener('click', createNewChat);
    document.getElementById('settingsBtn').addEventListener('click', openSettings);
    document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
    document.getElementById('resetSystemBtn').addEventListener('click', () => {
      document.getElementById('systemInput').value = DEFAULT_SYSTEM;
    });
    document.getElementById('toggleApiKey').addEventListener('click', function () {
      const inp = document.getElementById('apiKeyInput');
      inp.type = inp.type === 'password' ? 'text' : 'password';
      this.textContent = inp.type === 'password' ? '表示' : '隠す';
    });
    document.getElementById('sendBtn').addEventListener('click', sendMessage);

    // ── Enter×2 to send ──
    let enterPending = false;
    let enterTimer = null;
    document.getElementById('messageInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        if (!input.value.trim()) return;
        if (enterPending) {
          clearTimeout(enterTimer);
          enterPending = false;
          document.getElementById('enterHint').style.display = 'none';
          sendMessage();
        } else {
          enterPending = true;
          document.getElementById('enterHint').style.display = 'block';
          enterTimer = setTimeout(() => {
            enterPending = false;
            document.getElementById('enterHint').style.display = 'none';
          }, 1500);
        }
      }
    });

    document.getElementById('messageInput').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 192) + 'px';
    });
    document.getElementById('settingsModal').addEventListener('click', e => {
      if (e.target === document.getElementById('settingsModal')) closeSettings();
    });

    // ── Sidebar toggle ──
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('collapsed');
      overlay.classList.toggle('active', !sidebar.classList.contains('collapsed') && window.innerWidth <= 768);
    }
    document.getElementById('sidebarToggle').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('sidebarOverlay').classList.remove('active');
    });
    // Auto-collapse sidebar on mobile
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.add('collapsed');
    }

    // ── Scroll-down button ──
    const messagesArea = document.getElementById('messagesArea');
    const scrollDownBtn = document.getElementById('scrollDownBtn');
    messagesArea.addEventListener('scroll', () => {
      const distFromBottom = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight;
      scrollDownBtn.style.display = distFromBottom > 150 ? 'flex' : 'none';
    });
    scrollDownBtn.addEventListener('click', scrollBottom);

    // ── Init ──
    loadState();
    updateBadge();

    if (state.chats.length === 0) {
      createNewChat();
    } else {
      if (!state.currentChatId || !state.chats.find(c => c.id === state.currentChatId))
        state.currentChatId = state.chats[0].id;
      renderSidebar();
      renderMessages();
    }

    if (!state.apiKey) setTimeout(openSettings, 400);
  </script>
</body>
</html>
