<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini TTS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0891b2 0%, #6366f1 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0891b2 0%, #6366f1 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.9; }
        .content { padding: 24px; }
        .section { margin-bottom: 24px; }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0891b2;
        }
        .input-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }
        input[type="text"], input[type="password"], textarea, select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #0891b2;
        }
        textarea { resize: vertical; min-height: 150px; }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #0891b2 0%, #6366f1 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .audio-result {
            margin-top: 16px;
            padding: 20px;
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            text-align: center;
        }
        .audio-result audio { width: 100%; margin-bottom: 12px; }
        .btn-download {
            display: inline-block;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: #059669;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-download:active { transform: scale(0.98); }
        .tips {
            font-size: 13px;
            color: #555;
            background: #f0f7ff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            line-height: 1.7;
        }
        .tips strong { color: #0891b2; }
        .tips code {
            background: #e0ecff;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 12px;
        }
        .loading { text-align: center; padding: 20px; color: #0891b2; font-weight: 500; }
        .error {
            padding: 12px; background: #fef2f2; border: 1px solid #fecaca;
            border-radius: 8px; color: #dc2626; font-size: 14px; margin-top: 12px;
            white-space: pre-wrap; word-break: break-word;
        }
        .success {
            padding: 12px; background: #f0fdf4; border: 1px solid #bbf7d0;
            border-radius: 8px; color: #16a34a; font-size: 14px; margin-top: 12px;
        }
        .hint { font-size: 12px; color: #888; margin-top: 6px; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
        .loading { animation: pulse 1.5s ease-in-out infinite; }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .header { padding: 16px; }
            .content { padding: 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gemini TTS</h1>
            <p>Text-to-Speech with Gemini 3.1 Flash TTS Preview via OpenRouter</p>
        </div>
        <div class="content">
            <!-- API Key -->
            <div class="section">
                <div class="section-title">API Key</div>
                <div class="input-group">
                    <label for="apiKey">OpenRouter API Key</label>
                    <input type="password" id="apiKey">
                </div>
            </div>

            <!-- Sample Prompts -->
            <div class="section">
                <div class="section-title">Sample Prompts</div>
                <div class="input-group">
                    <label for="sampleSelect">Load a preset to quickly test</label>
                    <select id="sampleSelect">
                        <option value="">-- Select a sample prompt --</option>
                        <option value="s0">News Anchor / Informative</option>
                        <option value="s1">Radio DJ / Energetic</option>
                        <option value="s2">Storytelling / Soft</option>
                        <option value="s3">Presentation / Firm</option>
                        <option value="s4">Emotional Acting / Excitable</option>
                        <option value="s5">Whisper ASMR / Breathy</option>
                        <option value="s6">Weather Forecast / Even</option>
                    </select>
                </div>
            </div>

            <!-- Voice Config -->
            <div class="section">
                <div class="section-title">Voice</div>
                <div class="input-group">
                    <label for="voiceSelect">Select Voice</label>
                    <select id="voiceSelect"></select>
                </div>
            </div>

            <!-- Tips -->
            <div class="tips">
                <strong>Tips:</strong> Use natural language for style directions (e.g. "Say cheerfully:").
                Inline audio tags change delivery: <code>[whispers]</code> <code>[laughs]</code>
                <code>[excited]</code> <code>[sighs]</code> <code>[shouting]</code> <code>[serious]</code>
            </div>

            <!-- Text Input -->
            <div class="section">
                <div class="section-title">Text</div>
                <div class="input-group">
                    <label for="textInput">Enter text to convert to speech</label>
                    <textarea id="textInput" placeholder="Say cheerfully: Have a wonderful day!"></textarea>
                </div>
            </div>

            <!-- Generate -->
            <button class="btn" id="generateBtn">Generate Speech</button>
            <div id="statusMsg"></div>

            <!-- Audio Player -->
            <div class="audio-result" id="audioResult" style="display: none;">
                <audio id="audioElement" controls></audio>
                <br>
                <a class="btn-download" id="downloadBtn" download="gemini-tts.mp3">Download MP3</a>
            </div>
        </div>
    </div>

    <script>
        // ── Voice data [name, style, pitch] ──
        const VOICES = [
            ['Achernar',        'Soft',            'Higher pitch'],
            ['Achird',          'Friendly',        'Lower middle pitch'],
            ['Algenib',         'Gravelly',        'Lower pitch'],
            ['Algieba',         'Smooth',          'Lower pitch'],
            ['Alnilam',         'Firm',            'Lower middle pitch'],
            ['Aoede',           'Breezy',          'Middle pitch'],
            ['Autonoe',         'Bright',          'Middle pitch'],
            ['Callirrhoe',      'Easy-going',      'Middle pitch'],
            ['Charon',          'Informative',     'Lower pitch'],
            ['Despina',         'Smooth',          'Middle pitch'],
            ['Enceladus',       'Breathy',         'Lower pitch'],
            ['Erinome',         'Clear',           'Middle pitch'],
            ['Fenrir',          'Excitable',       'Lower middle pitch'],
            ['Gacrux',          'Mature',          'Middle pitch'],
            ['Iapetus',         'Clear',           'Lower middle pitch'],
            ['Kore',            'Firm',            'Middle pitch'],
            ['Laomedeia',       'Upbeat',          'Higher pitch'],
            ['Leda',            'Youthful',        'Higher pitch'],
            ['Orus',            'Firm',            'Lower middle pitch'],
            ['Puck',            'Upbeat',          'Middle pitch'],
            ['Pulcherrima',     'Forward',         'Middle pitch'],
            ['Rasalgethi',      'Informative',     'Middle pitch'],
            ['Sadachbia',       'Lively',          'Lower pitch'],
            ['Sadaltager',      'Knowledgeable',   'Middle pitch'],
            ['Schedar',         'Even',            'Lower middle pitch'],
            ['Sulafat',         'Warm',            'Middle pitch'],
            ['Umbriel',         'Easy-going',      'Lower middle pitch'],
            ['Vindemiatrix',    'Gentle',          'Middle pitch'],
            ['Zephyr',          'Bright',          'Higher pitch'],
            ['Zubenelgenubi',   'Casual',          'Lower middle pitch'],
        ];

        // ── Sample prompts ──
        const SAMPLES = [
            { voice: 'Charon',    text: `ニュースキャスターとして落ち着いたトーンで読んでください：\n本日午前10時、東京都心部で桜の開花宣言が発表されました。気象庁によりますと、今年の開花は例年より5日早く、週末には見頃を迎える見込みです。各地の公園では、早くも花見の準備が進められています。` },
            { voice: 'Puck',      text: `元気いっぱいのラジオDJとして話してください：\n[excited] おはようございます！朝7時になりました！今日も最高の一日にしていきましょう！[laughs] さあ次の曲は、リクエストナンバーワン！ボリューム上げていきますよー！` },
            { voice: 'Achernar',  text: `静かに、やさしく朗読してください：\nむかしむかし、ある山の奥深くに、小さな村がありました。[short pause] その村には、不思議な力を持つおばあさんが住んでいました。[whispers] 誰も知らない秘密を、彼女だけが知っていたのです。` },
            { voice: 'Kore',      text: `自信を持って、はっきりと話してください：\n本日は弊社の新製品についてご紹介いたします。この製品は、従来の課題を根本から解決する画期的なソリューションです。これから、3つの主要な特長について順にご説明いたします。` },
            { voice: 'Fenrir',    text: `[amazed] え、本当に？信じられない！[excited] やった！ついにやったんだ！[crying] こんなに嬉しいことはないよ... [laughs] みんな、本当にありがとう！最高だよ！` },
            { voice: 'Enceladus', text: `[whispers] こんばんは。今日も一日おつかれさまでした。[short pause] [whispers] 目を閉じて、ゆっくり深呼吸をしましょう。[short pause] [whispers] 大丈夫。すべてうまくいきますよ。おやすみなさい。` },
            { voice: 'Schedar',   text: `落ち着いたトーンで天気予報を読んでください：\n明日の天気です。関東地方は朝から晴れ、最高気温は22度の予想です。午後からは雲が広がりますが、雨の心配はないでしょう。週末はお出かけ日和となりそうです。` },
        ];

        // ── Constants ──
        const API_URL = 'https://openrouter.ai/api/v1/audio/speech';
        const MODEL   = 'google/gemini-3.1-flash-tts-preview';

        // ── DOM refs ──
        const $ = id => document.getElementById(id);
        const apiKeyInput = $('apiKey');
        const voiceSelect = $('voiceSelect');
        const textInput   = $('textInput');
        let currentAudioUrl = null;

        // ── Init voices ──
        VOICES.forEach(([name, style, pitch]) => {
            const o = document.createElement('option');
            o.value = name;
            o.textContent = `${name} — ${style} / ${pitch}`;
            voiceSelect.appendChild(o);
        });

        // ── API key persistence ──
        const saved = localStorage.getItem('openrouter_api_key');
        if (saved) apiKeyInput.value = saved;
        apiKeyInput.addEventListener('input', () => localStorage.setItem('openrouter_api_key', apiKeyInput.value));

        // ── Sample prompt loader ──
        $('sampleSelect').addEventListener('change', function() {
            const v = this.value;
            if (!v) return;
            const s = SAMPLES[parseInt(v.substring(1))];
            voiceSelect.value = s.voice;
            textInput.value = s.text;
            textInput.focus();
        });

        // ── Generate ──
        $('generateBtn').addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const text   = textInput.value.trim();
            if (!apiKey) return showStatus('error', 'OpenRouter API Key を入力してください。');
            if (!text)   return showStatus('error', 'テキストを入力してください。');

            showStatus('loading', '音声を生成中...');
            $('generateBtn').disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type':  'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                    },
                    body: JSON.stringify({
                        model: MODEL,
                        input: text,
                        voice: voiceSelect.value,
                        response_format: 'mp3',
                    }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error?.message || `HTTP ${res.status}`);
                }

                const arrayBuffer = await res.arrayBuffer();
                const blob = new Blob([arrayBuffer], { type: 'audio/mpeg' });

                if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
                currentAudioUrl = URL.createObjectURL(blob);

                const audioEl = $('audioElement');
                audioEl.src = currentAudioUrl;
                $('downloadBtn').href = currentAudioUrl;
                $('audioResult').style.display = 'block';
                showStatus('success', '音声の生成が完了しました。');
                audioEl.play();
            } catch (e) {
                showStatus('error', 'Error: ' + e.message);
            } finally {
                $('generateBtn').disabled = false;
            }
        });

        function showStatus(type, msg) {
            const el = $('statusMsg');
            if (type === 'loading') el.innerHTML = `<div class="loading">${msg}</div>`;
            else if (type === 'error') el.innerHTML = `<div class="error">${msg}</div>`;
            else el.innerHTML = `<div class="success">${msg}</div>`;
        }
    </script>
</body>
</html>
